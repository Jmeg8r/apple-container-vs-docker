# WHAT: the authoritative secret scan. Runs an exactly-pinned, checksum-verified
#       gitleaks, so the verdict does not depend on any developer machine.
#
# WHY this exists alongside the lefthook hooks: the local gate enforces a version
# FLOOR (scripts/gitleaks-version.env explains why an exact local pin would be worse).
# A floor still permits two developers to get different answers. This job is the one
# result that is reproducible by construction — same version, same checksum, same
# config, every run.
#
# Injection note: no `github.event.*` value is interpolated anywhere in this file. The
# only expression is `github.ref` in a concurrency group, which is never shell-evaluated.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # A secret scan that hangs is a gate that never reports. Without this the job
    # inherits the 6-hour default and a wedged step burns the runner all morning.
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA, not a tag: a tag is mutable, and this is the workflow
      # that guards the repo's data-egress boundary. SHA is actions/checkout v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0   # the history scan needs the whole history
          # This job checks out PR-controlled code and then runs shell scripts FROM
          # that checkout. actions/checkout otherwise leaves GITHUB_TOKEN in the local
          # git config, so those scripts would run with an authenticated remote sitting
          # in .git/config. Nothing here needs authenticated git access.
          persist-credentials: false

      # Every line matched here is written into the step environment, and on a
      # pull_request run this file comes from the PR BRANCH. An attacker-authored
      # `PATH=...` or `LD_PRELOAD=...` line would land in $GITHUB_ENV and take effect
      # for every later step. So: allowlist the four names this workflow actually
      # uses, anchor the value to the charset a version/checksum can contain, and cap
      # the count. Reading a value it does not recognise is not a thing this step does.
      - name: Load pinned versions
        run: |
          grep -E '^GITLEAKS_(MIN_VERSION|PINNED_VERSION|PINNED_SHA256_LINUX_(X64|ARM64))=[A-Za-z0-9._-]+$' \
            scripts/gitleaks-version.env > /tmp/pins.env || true
          n=$(wc -l < /tmp/pins.env)
          if [ "$n" -lt 1 ] || [ "$n" -gt 4 ]; then
            echo "::error::expected 1-4 pinned constants, got $n — refusing to load"
            exit 1
          fi
          cat /tmp/pins.env >> "$GITHUB_ENV"

      - name: Install pinned gitleaks
        run: |
          case "$(uname -m)" in
            x86_64)  arch=x64;   want="$GITLEAKS_PINNED_SHA256_LINUX_X64" ;;
            aarch64) arch=arm64; want="$GITLEAKS_PINNED_SHA256_LINUX_ARM64" ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          # Say plainly that a constant is missing. Comparing against an empty
          # string still fails closed, but it reports as "checksum mismatch,
          # expected <blank>", which sends you to look at the wrong thing.
          if [ -z "${GITLEAKS_PINNED_VERSION:-}" ] || [ -z "$want" ]; then
            echo "::error::a pinned constant is missing from scripts/gitleaks-version.env"
            echo "  GITLEAKS_PINNED_VERSION='${GITLEAKS_PINNED_VERSION:-}'"
            echo "  expected-sha for ${arch}='${want}'"
            exit 1
          fi

          tarball="gitleaks_${GITLEAKS_PINNED_VERSION}_linux_${arch}.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_PINNED_VERSION}/${tarball}"

          # An unverified download is a supply-chain hole in the tool that guards the repo.
          got=$(sha256sum "$tarball" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::checksum mismatch for ${tarball}"
            echo "  expected ${want}"
            echo "  got      ${got}"
            exit 1
          fi

          # Deliberately NOT /usr/bin: the self-test asserts the guard errors when no
          # gitleaks is on PATH, which it checks by falling back to the system dirs.
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Confirm the pinned binary is the one on PATH
        run: |
          got=$(gitleaks version)
          if [ "$got" != "$GITLEAKS_PINNED_VERSION" ]; then
            echo "::error::expected gitleaks ${GITLEAKS_PINNED_VERSION}, PATH resolved to ${got}"
            exit 1
          fi
          echo "gitleaks ${got} (pinned, checksum-verified)"

      # Behavioural proof, at the pinned version. If .gitleaks.toml's documented
      # coverage has drifted, this fails before the scan below can report a
      # reassuring green on unknown coverage.
      - name: Prove documented coverage still holds
        run: ./scripts/test-gitleaks-guard.sh

      # The binary path needs pdftotext. Installed explicitly so its absence is an
      # install failure here rather than a silently reduced scan below.
      - name: Install pdftotext (poppler)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # THE GAP THIS CLOSES: every step above scans with gitleaks, which skips
      # pdf/xlsx/docx/svg BY PATH. So the authoritative, reproducible-by-construction
      # check had exactly the hole the local gate was built to close -- CI went green
      # on a PR whose only change was a secret inside a PDF. Running the binary
      # scanner's own suite here proves the second gate still works at the pinned
      # version, on a machine that is not a developer's laptop.
      - name: Prove the binary scan still works
        run: ./scripts/selftest-binary-scan.sh

      # And exercise the scanner against the PR's own staged content. `git diff
      # --cached` is empty on a fresh checkout, so stage the merge-base diff to give
      # it something real to read; a zero-file run is reported, not treated as clean.
      #
      # BASE_REF arrives via env, never interpolated into the shell. `github.base_ref`
      # is a branch name rather than free text, so this is not the classic injection
      # case -- but "${{ }}" pasted into a run: block is the shape that becomes one the
      # moment someone copies it next to a head_ref or a PR title. Quote it in env and
      # the question never arises.
      - name: Scan this PR's binary files
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # PUSH EVENTS ARE COVERED TOO. `github.base_ref` is set only on
          # pull_request, so on a push to main this resolved to an empty base, and the
          # step below scanned NOTHING while the workflow went green. The one path
          # where a binary reaches main without a PR was the one path with no binary
          # scan -- the same shape as the original bug, one level up.
          if [ -n "$BASE_REF" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || echo '')
            what="merge base against $BASE_REF"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"        # push: diff against what the ref pointed at before
            what="previous ref position"
          else
            base=$(git rev-parse HEAD^ 2>/dev/null || echo '')
            what="HEAD^ (first push, or a before-SHA outside this clone)"
          fi

          # FAIL CLOSED on base resolution. This exited 0 with a notice, which meant a
          # shallow fetch or an unrelated-history PR left every binary file UNINSPECTED
          # while the security gate reported success -- the same defect this whole
          # workflow exists to remove, reintroduced in the step that removes it.
          # "Could not determine what changed" is UNKNOWN, never clean.
          if [ -z "$base" ]; then
            echo "::error::could not resolve a base ($what) — cannot determine which binary files changed, so none were scanned"
            exit 1
          fi
          echo "comparing against $what: $base"

          # NUL-DELIMITED THROUGHOUT. `-z` was asked for and then immediately undone
          # with `tr '\0' '\n'`, which reintroduces exactly what -z prevents: git paths
          # may contain newlines, so `secret\n.pdf` was counted as one binary file and
          # then staged as `.pdf` -- a path that does not exist. With `git add` failures
          # swallowed by `|| true`, the real file was never staged and the scan that
          # followed reported clean on content it had not read.
          changed=$(git diff --name-only -z --no-renames --diff-filter=ACMT "$base" HEAD \
                    | grep -zicE '\.(pdf|xlsx|docx|pptx|svg|zip)$' || true)
          echo "binary/document files changed in this PR: $changed"
          if [ "$changed" -gt 0 ]; then
            # `git add` failures are FATAL here. A file that cannot be staged is a file
            # the scanner below will not see, and continuing past it manufactures the
            # clean result this step exists to withhold.
            #
            # Note the `< <(...)` rather than a pipe: a `while` loop on the right-hand
            # side of a pipeline runs in a SUBSHELL, so `exit 1` there would end the
            # subshell and the step would carry on to the scan regardless -- a fail-open
            # guard dressed as a fatal one. Process substitution keeps the loop in this
            # shell so the exit actually exits.
            staged=0
            while IFS= read -r -d '' f; do
              git add -- "$f" || { echo "::error::could not stage $f — refusing to report a scan that skipped it"; exit 1; }
              staged=$((staged + 1))
            done < <(git diff --name-only -z --no-renames --diff-filter=ACMT "$base" HEAD \
                     | grep -ziE '\.(pdf|xlsx|docx|pptx|svg|zip)$')
            if [ "$staged" -ne "$changed" ]; then
              echo "::error::counted $changed binary file(s) but staged $staged — refusing to report a partial scan"
              exit 1
            fi
            ./scripts/scan-staged-binaries.sh
          fi

      - name: Full-history secret scan
        run: |
          rc=0
          out=$(./scripts/gitleaks-guard.sh git --no-banner --redact --log-level info 2>&1) || rc=$?
          printf '%s\n' "$out"

          # A check that passed while scanning zero input is not a pass. gitleaks
          # reports the volume it examined; if that is zero, the green tick means
          # "not inspected", which is a different claim from "clean".
          if printf '%s' "$out" | grep -q 'scanned ~0 bytes'; then
            echo "::error::the scan examined 0 bytes — treat this as UNKNOWN, not clean"
            exit 1
          fi
          exit "$rc"

      - name: Standing limits
        if: always()
        run: |
          echo "::notice::A green result here covers TEXT only. No scanner in this chain"
          echo "::notice::reads inside pdf/xlsx/docx/images — see the STANDING LIMIT note in"
          echo "::notice::.gitleaks.toml. Binaries in a diff must still be judged by hand."
